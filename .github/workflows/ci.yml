name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.5']
        # Go 1.21 构建的测试二进制无法在 macos-latest（新版 dyld）加载
        # （missing LC_UUID），macOS 仅验证 1.21.x。
        exclude:
          - os: macos-latest
            go: '1.26.5'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        # setup-go v7 默认 GOTOOLCHAIN=local；staticcheck 2026.1 要求 Go >= 1.25，
        # 这里恢复 auto，让 Go 1.21 矩阵自动切换到所需工具链。
        env:
          GOTOOLCHAIN: auto
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race detector (Linux)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: Coverage (Linux)
        if: runner.os == 'Linux'
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Show coverage
        if: runner.os == 'Linux'
        run: go tool cover -func coverage.out

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.go }}
          path: coverage.out

  linux-distros:
    name: test (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:bookworm
            prepare: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl tar
          - distro: fedora:41
            prepare: dnf -y install git ca-certificates curl tar
          - distro: rockylinux:9
            prepare: dnf -y install --setopt=install_weak_deps=False git
          - distro: archlinux:latest
            prepare: pacman -Syu --noconfirm git ca-certificates curl tar
          - distro: alpine:3.20
            prepare: apk add --no-cache git ca-certificates curl tar
    runs-on: ubuntu-latest
    container: ${{ matrix.distro }}
    env:
      # 容器矩阵仅验证纯 Go 构建链路（glibc/musl 差异），
      # cgo/race 由 ubuntu 主机作业覆盖。
      CGO_ENABLED: '0'
    steps:
      - name: Prepare environment
        run: ${{ matrix.prepare }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Test
        run: go test -count=1 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Fuzz short run (10s per target)
        run: |
          for f in FuzzErrorFormat FuzzWrapChain FuzzIs FuzzRetryable; do
            go test -run '^$' -fuzz "^${f}$" -fuzztime=10s .
          done
